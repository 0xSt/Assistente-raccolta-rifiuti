[project]
name = "ecoscan-local"
version = "0.47.0"
description = "Assistente locale per la raccolta differenziata: ETL da fonti comunali, schema dati e retrieval ibrido"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "qdrant-client>=1.12,<1.13",  # allineata al server del docker-compose
    "python-dotenv>=1.0",
    "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "streamlit>=1.64.0",
    "mlflow>=3.16.1",
]

[project.scripts]
ecoscan-torino = "ecoscan.etl.extract_torino:main"
ecoscan-napoli = "ecoscan.etl.extract_napoli:main"
ecoscan-torino-regole = "ecoscan.etl.extract_torino_regole:main"
ecoscan-transform = "ecoscan.etl.esegui_transform:main"
ecoscan-regole = "ecoscan.etl.normalizza_regole:main"
ecoscan-ispeziona = "ecoscan.etl.ispeziona_napoli:main"
ecoscan-frontend = "ecoscan.frontend.app:main"
ecoscan-api = "ecoscan.api.app:main"
ecoscan-analizza = "ecoscan.agente.prova:main"
ecoscan-vettorizza = "ecoscan.db.vettorizza:main"
ecoscan-prompt = "ecoscan.osservabilita.prompt_registrati:main"
ecoscan-documenti = "ecoscan.db.documenti:main"
ecoscan-carica = "ecoscan.db.carica:main"
ecoscan-valuta = "ecoscan.valutazione.esegui:main"
ecoscan-campiona = "ecoscan.valutazione.campiona:main"
ecoscan-valuta-foto = "ecoscan.valutazione.foto:main"
ecoscan-nomi = "ecoscan.etl.qualita_nomi:main"

[dependency-groups]
dev = ["pytest>=8.0", "numpy>=1.26", "pyyaml>=6.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoscan"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# F: errori veri (nomi e import morti). B: trappole note. ARG: parametri inutilizzati.
# SIM, RET, C4: semplificazioni che rendono il codice più corto senza cambiarlo.
select = ["F", "E", "W", "B", "ARG", "SIM", "RET", "C4", "UP"]
# B008 è l'idioma di FastAPI (Depends/File/Form nei valori predefiniti), non un difetto.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# I doppi di prova implementano firme che non usano: è il loro mestiere.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # per importare gli strumenti condivisi da tests/conftest.py
addopts = "-q -p no:cacheprovider"
