[project]
name = "ecoscan-local"
version = "0.14.0"
description = "Assistente locale per la raccolta differenziata: ETL da fonti comunali, schema dati e retrieval ibrido"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "qdrant-client>=1.12",
    "python-dotenv>=1.0",
]

[project.scripts]
ecoscan-torino = "ecoscan.etl.extract_torino:main"
ecoscan-napoli = "ecoscan.etl.extract_napoli:main"
ecoscan-torino-regole = "ecoscan.etl.extract_torino_regole:main"
ecoscan-transform = "ecoscan.etl.esegui_transform:main"
ecoscan-regole = "ecoscan.etl.normalizza_regole:main"
ecoscan-ispeziona = "ecoscan.etl.ispeziona_napoli:main"
ecoscan-vettorizza = "ecoscan.db.vettorizza:main"
ecoscan-indicizza = "ecoscan.db.indicizza:main"
ecoscan-carica = "ecoscan.db.carica:main"

[dependency-groups]
dev = ["pytest>=8.0", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
